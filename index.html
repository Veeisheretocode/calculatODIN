<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CALCULATOR</h1>
    <div class="container">

        <div class="display" id="display"></div>

        <div class="op-num-btns">

            <div class="row1">
                <button class="clear" id="clear">CLR</button>
                <button class="backspace" id="backspace">[ x ]</button>
                <button class="op" id="divide">/</button>
            </div>

            <div class="row2">
                <button class="num" id="1">1</button>
                <button class="num" id="2">2</button>
                <button class="num" id="3">3</button>
                <button class="op" id="add">+</button>
            </div>

            <div class="row3">
                <button class="num" id="4">4</button>
                <button class="num" id="5">5</button>
                <button class="num" id="6">6</button>
                <button class="op" id="subtract">-</button>
            </div>

            <div class="row4">
                <button class="num" id="7">7</button>
                <button class="num" id="8">8</button>
                <button class="num" id="9">9</button>
                <button class="op" id="multiply">*</button>
            </div>

            <div class="row5">
                <button class="num" id="0">0</button>
                <button class="num" id="00">00</button>
                <button class="op" id="deci">.</button>
                <button class="equals" id="equals">=</button>
            </div>
        </div>

    </div>



    <script src="script.js"></script>
</body>

</html>
